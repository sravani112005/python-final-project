<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Blood Bank System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --blood-red: #d32f2f;
            --light-red: #ffebee;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f5f5f5;
        }
        .sidebar {
            background-color: white;
            height: 100vh;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }
        .sidebar .nav-link {
            color: #333;
            padding: 12px 20px;
            border-radius: 0;
            margin: 5px 0;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background-color: var(--light-red);
            color: var(--blood-red);
        }
        .sidebar .nav-link i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }
        .profile-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.05);
        }
        .profile-header {
            border-bottom: 2px solid var(--light-red);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .profile-pic {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border: 3px solid var(--blood-red);
        }
        .btn-edit {
            background-color: var(--blood-red);
            color: white;
        }
        .btn-edit:hover {
            background-color: #b71c1c;
        }
        .info-label {
            font-weight: 600;
            color: #555;
        }
        .info-value {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 d-md-block sidebar p-0">
                <div class="p-4">
                    <h4 class="text-center mb-4" style="color: var(--blood-red);">Blood Bank</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">
                                <i class="fas fa-user"></i> My Profile
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                <i class="fas fa-history"></i> Donation History
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                <i class="fas fa-bell"></i> Notifications
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                <i class="fas fa-sign-out-alt"></i> Sign Out
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 ms-sm-auto p-4">
                <div class="profile-container p-4">
                    <div class="profile-header d-flex justify-content-between align-items-center">
                        <h3 style="color: var(--blood-red);">
                            <i class="fas fa-user-edit me-2"></i>Edit Profile
                        </h3>
                        <button class="btn btn-edit">
                            <i class="fas fa-save me-1"></i>Update
                        </button>
                    </div>

                    <div class="row">
                        <div class="col-md-4 text-center">
                            <img src="https://ui-avatars.com/api/?name=Sohitha&background=d32f2f&color=fff" 
                                 class="profile-pic rounded-circle mb-3">
                            <h5>Sohitha</h5>
                            <p class="text-muted">Donor</p>
                        </div>
                        <div class="col-md-8">
                            <form>
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label class="info-label">Full Name</label>
                                        <input type="text" class="form-control info-value" value="Sohitha">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="info-label">Phone Number</label>
                                        <input type="tel" class="form-control info-value" value="9491311569">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="info-label">Address</label>
                                    <textarea class="form-control info-value" rows="3">10-65, Sri Vishnu Nagar Near Thondawada, Chandragiri, Tirupati</textarea>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label class="info-label">Blood Type</label>
                                        <select class="form-select info-value">
                                            <option>A+</option>
                                            <option>B+</option>
                                            <option selected>O+</option>
                                            <option>AB+</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="info-label">Last Donation</label>
                                        <input type="date" class="form-control info-value" value="2023-06-15">
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simple form interaction example
        document.querySelector('.btn-edit').addEventListener('click', function() {
            alert('Profile updated successfully!');
            // In real implementation, you would submit to your backend API
        });
    </script>
</body>
</html>
