<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Bank Management System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: url('https://images.unsplash.com/photo-1579684385127-1ef15d508118?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(211, 47, 47, 0.3); /* Red overlay */
            z-index: 0;
        }
        
        .login-container {
            max-width: 400px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            background: rgba(255, 255, 255, 0.95);
            z-index: 1;
            transform: translateY(0);
            transition: all 0.3s ease;
            border: 1px solid rgba(211, 47, 47, 0.2);
        }
        
        .login-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
            color: #d32f2f;
            font-weight: 700;
            position: relative;
            padding-bottom: 15px;
        }
        
        .login-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 25%;
            width: 50%;
            height: 3px;
            background: #d32f2f;
            border-radius: 3px;
        }
        
        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #ddd;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .form-control:focus {
            border-color: #d32f2f;
            box-shadow: 0 0 0 0.25rem rgba(211, 47, 47, 0.25);
        }
        
        .btn-login {
            background-color: #d32f2f;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        
        .btn-login:hover {
            background-color: #b71c1c;
            transform: translateY(-2px);
        }
        
        .role-selector {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .role-option {
            flex: 1;
            text-align: center;
            padding: 10px;
            margin: 0 5px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .role-option.active {
            border-color: #d32f2f;
            background-color: rgba(211, 47, 47, 0.1);
        }
        
        .role-option:hover {
            background-color: rgba(211, 47, 47, 0.05);
        }
        
        .role-icon {
            font-size: 24px;
            margin-bottom: 5px;
            color: #d32f2f;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <h2 class="login-header">Blood Bank Management System</h2>
        
        <div class="role-selector">
            <div class="role-option active" data-role="donor">
                <div class="role-icon"><i class="fas fa-user"></i></div>
                <div>Donor</div>
            </div>
            <div class="role-option" data-role="hospital">
                <div class="role-icon"><i class="fas fa-hospital"></i></div>
                <div>Hospital</div>
            </div>
            <div class="role-option" data-role="admin">
                <div class="role-icon"><i class="fas fa-lock"></i></div>
                <div>Admin</div>
            </div>
        </div>
        
        <form id="loginForm">
            <div class="mb-3">
                <input type="email" class="form-control" id="email" placeholder="Email Address" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-login">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>
    </div>

    <script>
        // Role selection
        const roleOptions = document.querySelectorAll('.role-option');
        roleOptions.forEach(option => {
            option.addEventListener('click', function() {
                roleOptions.forEach(opt => opt.classList.remove('active'));
                this.classList.add('active');
            });
        });
        
        // Form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.querySelector('.role-option.active').dataset.role;
            
            console.log(`Login attempt as ${role} with:`, email, password);
            
            // Simulate loading
            const btn = e.target.querySelector('button');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Authenticating...';
            btn.disabled = true;
            
            // Replace with actual API call
            setTimeout(() => {
                // Example redirect based on role
                switch(role) {
                    case 'donor':
                        window.location.href = 'donor-dashboard.html';
                        break;
                    case 'hospital':
                        window.location.href = 'hospital-dashboard.html';
                        break;
                    case 'admin':
                        window.location.href = 'admin-dashboard.html';
                        break;
                }
            }, 1500);
        });
    </script>
</body>
</html>
